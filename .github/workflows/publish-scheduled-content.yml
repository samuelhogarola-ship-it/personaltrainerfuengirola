name: Publish Scheduled Content

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild static site for today's publish window
        env:
          TZ: Europe/Madrid
        run: node scripts/build.mjs

      - name: Commit and push when scheduled content changes
        run: |
          if git diff --quiet; then
            echo "No scheduled content to publish today."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: publish scheduled content"
          git push
